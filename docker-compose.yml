services:
  db:
    image: postgres:16
    container_name: ladies-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ladies
      POSTGRES_PASSWORD: ladies_dev
      POSTGRES_DB: ladies
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
